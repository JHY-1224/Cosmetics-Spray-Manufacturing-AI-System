# One private package and one persistent stack per physical host.
name: ${NODE_PROJECT:?generate a new independent node package}
x-app: &app
  image: quality-platform:0.2.0rc1
  build: {context: ..}
  env_file: ["${NODE_CONFIG_DIR:?}/runtime.env"]
  volumes: ["node-data:/data"]
  init: true
  restart: unless-stopped
  stop_grace_period: 90s
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: &logs
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_USER: quality_migrator
      POSTGRES_PASSWORD: ${NODE_DB_ADMIN_PASSWORD:?}
      POSTGRES_DB: quality
      DB_RUNTIME_PASSWORD: ${NODE_DB_RUNTIME_PASSWORD:?}
    volumes: ["node-db:/var/lib/postgresql/data", "./postgres-init.sh:/docker-entrypoint-initdb.d/01-runtime.sh:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality_migrator -d quality"]
      interval: 5s
      timeout: 3s
      retries: 20
  broker:
    image: rabbitmq:4.3.6-management
    restart: unless-stopped
    logging: *logs
    volumes: ["node-broker:/var/lib/rabbitmq", "./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro", "${NODE_CONFIG_DIR:?}/rabbit-definitions.json:/etc/rabbitmq/definitions.json:ro"]
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    logging: *logs
    command: ["server", "-ip=storage", "-ip.bind=0.0.0.0", "-dir=/data", "-filer", "-s3", "-s3.config=/etc/quality/s3.json", "-master.telemetry=false", "-s3.allowDeleteBucketNotEmpty=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    volumes: ["node-storage:/data", "${NODE_CONFIG_DIR:?}/s3.json:/etc/quality/s3.json:ro"]
  api:
    <<: *app
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    profiles: ["workers"]
    command: ["python", "-m", "quality.cli", "worker"]
  migrate:
    <<: *app
    profiles: ["maintenance"]
    restart: "no"
    depends_on: {db: {condition: service_healthy}}
    environment:
      QUALITY_MIGRATION_DATABASE_URL: postgresql+psycopg://quality_migrator:${NODE_DB_ADMIN_PASSWORD:?}@db:5432/quality
    command: ["python", "-m", "quality.cli", "migrate"]
  initialize:
    <<: *app
    profiles: ["maintenance"]
    restart: "no"
    stdin_open: true
    tty: true
    command: ["python", "-m", "quality.cli", "init", "--sites", "${INITIAL_ALLOWED_SITES:?}"]
  init-storage:
    <<: *app
    profiles: ["maintenance"]
    restart: "no"
    volumes: ["node-data:/data", "${NODE_CONFIG_DIR:?}/s3.json:/run/s3-bootstrap.json:ro"]
    command: ["python", "scripts/init_storage.py", "/run/s3-bootstrap.json", "${NODE_BUCKET:?}"]
  edge:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *logs
    ports: ["80:80", "443:443"]
    environment: {NODE_HOST: "${NODE_HOST:?}"}
    volumes: ["./Caddyfile.node:/etc/caddy/Caddyfile:ro", "node-caddy:/data", "node-caddy-config:/config"]
volumes:
  node-data:
  node-db:
  node-broker:
  node-storage:
  node-caddy:
  node-caddy-config:
